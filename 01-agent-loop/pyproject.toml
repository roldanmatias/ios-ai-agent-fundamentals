[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xcfix"
version = "0.1.0"
description = "An agent that fixes broken iOS builds and failing tests, with a hand-written agent loop."
readme = "xcfix/README.md"
requires-python = ">=3.12"
dependencies = ["anthropic>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xcfix = "xcfix.__main__:main"

[tool.setuptools]
# Only the package ships; tests/ and fixtures/ stay project files.
packages = ["xcfix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
